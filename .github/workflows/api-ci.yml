name: API CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Restore, build, and test API
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore apps/api/SquadSync.sln

      - name: Build
        run: dotnet build apps/api/SquadSync.sln --no-restore

      - name: Test
        run: dotnet test apps/api/SquadSync.sln --no-build
